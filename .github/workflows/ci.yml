name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U starter" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      meilisearch:
        image: getmeili/meilisearch:v1.13
        env:
          MEILI_MASTER_KEY: dev-master-key-change-me
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
    env:
      DATABASE_URL: postgresql://starter:starter@localhost:5432/starter_test
      REDIS_URL: redis://localhost:6379
      MEILI_HOST: http://localhost:7700
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Wait for Meilisearch
        run: for i in $(seq 1 30); do curl -sf http://localhost:7700/health && exit 0; sleep 1; done; exit 1
      - run: npx prisma migrate deploy
      - name: End-to-end tests (Postgres, Redis, Meilisearch)
        run: npm run test:e2e
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-used-to-validate-compose-file
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
